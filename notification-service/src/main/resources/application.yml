server:
  port: 8084
  servlet:
    trailing-slash: false

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:flowguard}
    password: ${SPRING_DATASOURCE_PASSWORD:flowguard123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:flowguard}
    password: ${SPRING_RABBITMQ_PASSWORD:flowguard123}
    connection-timeout: 60000
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 5000
          max-attempts: 10
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:test@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:app-password}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
            required: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

notification:
  recipient:
    email: ${NOTIFICATION_RECIPIENT_EMAIL:test@gmail.com}
  cooldown:
    minutes: 0
