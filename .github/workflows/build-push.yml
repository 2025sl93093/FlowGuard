name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - webhook-service
          - pipeline-service
          - analytics-service
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR for ${{ matrix.service }}
        run: mvn clean package -DskipTests -f ${{ matrix.service }}/pom.xml

      - name: Build Docker image for ${{ matrix.service }}
        run: docker build -t flowguard/${{ matrix.service }}:latest ./${{ matrix.service }}

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dashboard Docker image
        run: docker build -t flowguard/dashboard:latest ./dashboard
