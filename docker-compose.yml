services:

  postgres:
    image: postgres:16-alpine
    container_name: flowguard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowguard123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowguard-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flowguard-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-flowguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-flowguard123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowguard-net

  webhook-service:
    build: ./webhook-service
    image: ${DOCKER_HUB_USERNAME:-flowguard}/flowguard-webhook:v1.0.0
    container_name: flowguard-webhook
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-flowguard123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-flowguard}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-flowguard123}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-secret}
      FLOWGUARD_WEBHOOK_SKIP_SIGNATURE_VALIDATION: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - flowguard-net

  pipeline-service:
    build: ./pipeline-service
    image: ${DOCKER_HUB_USERNAME:-flowguard}/flowguard-pipeline:v1.0.0
    container_name: flowguard-pipeline
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pipeline_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-flowguard123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-flowguard}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-flowguard123}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - flowguard-net

  analytics-service:
    build: ./analytics-service
    image: ${DOCKER_HUB_USERNAME:-flowguard}/flowguard-analytics:v1.0.0
    container_name: flowguard-analytics
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/analytics_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-flowguard123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-flowguard}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-flowguard123}
      PIPELINE_SERVICE_URL: http://pipeline-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pipeline-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - flowguard-net

  notification-service:
    build: ./notification-service
    image: ${DOCKER_HUB_USERNAME:-flowguard}/flowguard-notification:v1.0.0
    container_name: flowguard-notification
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-flowguard123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-flowguard}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-flowguard123}
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: "465"
      SPRING_MAIL_USERNAME: ${GMAIL_USERNAME:-test@gmail.com}
      SPRING_MAIL_PASSWORD: ${GMAIL_APP_PASSWORD:-app-password}
      NOTIFICATION_RECIPIENT_EMAIL: ${NOTIFICATION_RECIPIENT_EMAIL:-test@gmail.com}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - flowguard-net

  nginx:
    image: nginx:alpine
    container_name: flowguard-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      webhook-service:
        condition: service_healthy
      pipeline-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - flowguard-net

  dashboard:
    build: ./dashboard
    image: ${DOCKER_HUB_USERNAME:-flowguard}/flowguard-dashboard:v1.0.0
    container_name: flowguard-dashboard
    ports:
      - "3000:80"
    depends_on:
      - nginx
    networks:
      - flowguard-net

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  flowguard-net:
    driver: bridge
