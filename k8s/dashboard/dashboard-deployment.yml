apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: flowguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: DOCKER_HUB_USERNAME/flowguard-dashboard:v1.0.0
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: flowguard
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
  type: NodePort
